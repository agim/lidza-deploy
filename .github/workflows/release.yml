name: Publish release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Existing stable version tag to retry
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LIDZA_DEPLOY_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.version || github.ref }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: true
      - name: Validate version and source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$LIDZA_DEPLOY_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          go test -race ./...
          go vet ./...
      - name: Build and verify both architectures
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            ./scripts/package-agent.sh "$arch"
            (cd dist && sha256sum -c "lidza-agent-linux-$arch.tar.gz.sha256")
            bundle=$(mktemp -d)
            tar -xzf "dist/lidza-agent-linux-$arch.tar.gz" -C "$bundle"
            (cd "$bundle" && sha256sum -c SHA256SUMS)
            test "$(cat "$bundle/ARCH")" = "$arch"
            if [ "$arch" = amd64 ]; then
              bash tests/release-version.sh "$bundle" "$LIDZA_DEPLOY_VERSION"
            fi
            rm -rf "$bundle"
          done
          git rev-parse HEAD > dist/SOURCE_COMMIT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundles
          path: |
            dist/lidza-agent-linux-*.tar.gz
            dist/lidza-agent-linux-*.tar.gz.sha256
            dist/SOURCE_COMMIT
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-bundles
          path: dist
      - name: Upload and verify draft assets, then publish
        shell: bash
        run: |
          set -euo pipefail
          trap 'rc=$?; echo "::error::Release command failed (exit $rc) at shell line $LINENO: $BASH_COMMAND"; exit "$rc"' ERR
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          export RELEASE_COMMIT=$(cat dist/SOURCE_COMMIT)
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          rm dist/SOURCE_COMMIT
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp > releases.json
          python3 - <<'PYCODE'
          import json, os
          matches = [r for page in json.load(open('releases.json')) for r in page if r['tag_name'] == os.environ['VERSION']]
          assert len(matches) <= 1
          if matches:
              assert matches[0]['draft'], 'Refusing to overwrite a published release'
          json.dump(matches[0] if matches else {}, open('release-state.json', 'w'))
          PYCODE
          release_id=$(python3 -c 'import json; print(json.load(open("release-state.json")).get("id", ""))')
          if [ -z "$release_id" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$VERSION" -f target_commitish="$RELEASE_COMMIT" -F draft=true -F generate_release_notes=true > release-state.json
            release_id=$(python3 -c 'import json; print(json.load(open("release-state.json"))["id"])')
          fi
          (cd dist && sha256sum -c lidza-agent-linux-amd64.tar.gz.sha256 && sha256sum -c lidza-agent-linux-arm64.tar.gz.sha256)
          python3 - <<'PYCODE'
          import json, os, subprocess, urllib.request, urllib.parse
          from pathlib import Path
          release = json.load(open('release-state.json'))
          repository = os.environ['GITHUB_REPOSITORY']
          upload = release['upload_url'].split('{', 1)[0]
          assert upload == f"https://uploads.github.com/repos/{repository}/releases/{release['id']}/assets"
          files = {p.name: p for p in Path('dist').iterdir() if p.is_file()}
          assert len(files) == 4
          for asset in release['assets']:
              if asset['name'] in files:
                  subprocess.run(['gh', 'api', '--method', 'DELETE', f"repos/{repository}/releases/assets/{asset['id']}", '--silent'], check=True)
          for name, path in files.items():
              body = path.read_bytes()
              request = urllib.request.Request(upload + '?' + urllib.parse.urlencode({'name': name}), data=body, method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Content-Type': 'application/octet-stream', 'Content-Length': str(len(body)), 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=120) as response:
                  asset = json.load(response)
              assert asset['state'] == 'uploaded' and asset['size'] == len(body)
              print('Uploaded:', name)
          PYCODE
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > release.json
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          release = json.load(open('release.json'))
          assert release['draft'], 'Release must remain a draft until verified'
          assert release['target_commitish'] == os.environ['RELEASE_COMMIT'], 'Release source commit differs from build'
          expected = {p.name: p for p in Path('dist').iterdir() if p.is_file()}
          assert len(expected) == 4
          assets = {a['name']: a for a in release['assets']}
          assert set(assets) == set(expected), 'Release asset set differs from verified build'
          for name, path in expected.items():
              asset = assets[name]
              assert asset['state'] == 'uploaded'
              assert asset['size'] == path.stat().st_size
              assert asset['digest'] == 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest(), name
          print('Verified all four uploaded assets against the built files')
          PY
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -f tag_name="$VERSION" -F draft=false -F prerelease=false -f make_latest=true --silent
